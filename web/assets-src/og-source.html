<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background: #14171c;
    overflow: hidden;
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      repeating-linear-gradient(
        115deg,
        transparent 0px,
        transparent 46px,
        rgba(255, 122, 26, 0.055) 46px,
        rgba(255, 122, 26, 0.055) 50px,
        transparent 50px,
        transparent 140px
      ),
      #14171c;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  }

  .lane {
    position: absolute;
    left: 88px;
    right: 88px;
    top: 176px;
    height: 0;
    border-top: 4px dashed #2a2f37;
  }

  .wordmark {
    position: absolute;
    left: 88px;
    top: 76px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .wordmark .dot {
    width: 16px;
    height: 16px;
    background: #ff7a1a;
    border-radius: 3px;
    transform: rotate(45deg);
  }

  .wordmark .text {
    font-family: "Courier New", monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #f2f3f5;
  }

  .badge {
    position: absolute;
    right: 88px;
    top: 72px;
    font-family: "Courier New", monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffc107;
    background: #3a2f14;
    border: 1px solid #7a5f1e;
    border-radius: 999px;
    padding: 8px 20px;
  }

  h1 {
    position: absolute;
    left: 88px;
    top: 246px;
    margin: 0;
    width: 1024px;
    font-size: 68px;
    font-weight: 800;
    line-height: 1.08;
    letter-spacing: -0.01em;
    color: #f2f3f5;
    text-transform: uppercase;
    white-space: nowrap;
  }

  h1 span {
    color: #ff7a1a;
  }

  .lede {
    position: absolute;
    left: 92px;
    top: 486px;
    width: 900px;
    font-size: 27px;
    font-weight: 400;
    line-height: 1.5;
    color: #9aa0a6;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="wordmark"><div class="dot"></div><div class="text">KAVIS</div></div>
    <div class="badge">YAKINDA</div>
    <div class="lane"></div>
    <h1>Rotanı çiz.<br><span>Topluluğa katıl.</span></h1>
    <div class="lede">Motosikletçiler için rota keşfi, GPX kaydı, grup sürüşleri ve topluluk forumu.</div>
  </div>
</body>
</html>
