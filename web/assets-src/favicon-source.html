<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .tile {
    width: 512px;
    height: 512px;
    background: #14171c;
    border-radius: 112px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark {
    width: 224px;
    height: 224px;
    background: #ff7a1a;
    border-radius: 28px;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="tile"><div class="mark"></div></div>
</body>
</html>
